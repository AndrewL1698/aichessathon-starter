[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "onnxruntime==1.29.0",
]

# torch is a training-only dependency: `tools/nnue` imports it, nothing that ships does, and
# the runtime inference in `fastnnue.py` is numba over the exported integer weights. It is a
# 200 MB download, so it stays out of `uv sync` and arrives only with `uv sync --extra nnue`.
# The platform preinstalls torch 2.13 either way; this pin is what the training runs on.
[project.optional-dependencies]
nnue = ["torch==2.13.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "zstandard>=0.23"]

[tool.ruff]
line-length = 100
extend-exclude = ["local-opponents/sunfish/sunfish.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = [
    "agent.py",
    "fastboard.py",
    "fasteval.py",
    "fastnnue.py",
    "fastsearch.py",
    "harness",
    "tests",
]

# torch is the optional `nnue` extra, kept out of `uv sync` on purpose: it is a 200 MB download
# and nothing that ships imports it. `tests/test_king_buckets.py` reaches
# `tools/nnue/bucketize.py` for the warm-start round trip, and mypy follows that import into
# torch, so without this `make gate` would pass only on a machine that had synced the extra.
# Nothing under `tools/` is in `files` above; it is reached transitively, exactly like this.
[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true
